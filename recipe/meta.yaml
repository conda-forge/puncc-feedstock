{% set name = "puncc" %}
{% set version = "0.9.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/puncc-{{ version }}.tar.gz
  sha256: 8652e316a793cfe5e713ba99f56e350fd67adf47721f0f29e77bf9c888601ec1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - joblib
    - matplotlib-base
    - numpy <2.0.0
    - pandas
    - scikit-learn >=1.5
    - tqdm

test:
  imports:
    - deel.puncc
    - deel.puncc.api
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/deel-ai/puncc
  summary: Predictive UNcertainty Calibration and Conformalization Library
  license_file: MIT-Clause.txt
  license: MIT

extra:
  recipe-maintainers:
    - M-Mouhcine
    - CyrilJl
